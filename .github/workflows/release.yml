name: release
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1: Satellites Matrix (WebExtension, AgentSkills)
  # ---------------------------------------------------------------------------
  satellites:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "WebExtension"
            type: "web-clipper"
          - name: "AgentSkills"
            type: "skill-pack"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        if: matrix.type == 'web-clipper'
        with:
          version: 10

      - name: Compile and Bundle Extensions
        if: matrix.type == 'web-clipper'
        working-directory: web-clipper
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          mkdir -p artifacts
          cp dist/chrome.zip artifacts/solomd-clipper-chrome.zip
          cp dist/firefox.zip artifacts/solomd-clipper-firefox.zip
          cp dist/source.zip artifacts/solomd-clipper-source.zip

      - name: Upload WebExtension Artifacts
        if: matrix.type == 'web-clipper'
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-web-clipper
          path: web-clipper/artifacts/*
          if-no-files-found: error

      - name: Package Agent Skills
        if: matrix.type == 'skill-pack'
        run: |
          bash scripts/build-skill-pack.sh
          mkdir -p artifacts
          cp dist/solomd-skills-*.zip artifacts/

      - name: Upload Agent Skills Artifacts
        if: matrix.type == 'skill-pack'
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-skill-pack
          path: artifacts/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Phase 2: Multi-Platform Desktop Compilation Matrix (Fan-Out)
  # Executed ONLY after Phase 1 passes successfully
  # ---------------------------------------------------------------------------
  desktop:
    name: ${{ matrix.name }}
    needs: [satellites]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS Universal"
            platform: macos-latest
            args: '--bundles dmg'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - name: "Windows x64"
            platform: windows-latest
            args: '--bundles msi'
            rust_targets: ''
          - name: "Windows ARM64"
            platform: windows-11-arm
            args: '--bundles msi'
            rust_targets: ''
          - name: "Linux x64"
            platform: ubuntu-24.04
            args: '--bundles appimage,deb,rpm'
            rust_targets: ''
          - name: "Linux ARM64"
            platform: ubuntu-24.04-arm
            args: '--bundles appimage,deb,rpm'
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            mcp-server -> target

      - name: Install Linux Build Dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            xdg-utils \
            file \
            fuse \
            libfuse2

      - name: Install Frontend Dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Pre-build MCP Sidecar (Native Triple)
        shell: bash
        run: |
          TARGET_TRIPLE=$(rustc -vV | sed -n 's|host: ||p')
          echo "Building sidecar for native host triple: $TARGET_TRIPLE"
          cargo build --release --manifest-path mcp-server/Cargo.toml
          mkdir -p app/src-tauri/binaries
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp mcp-server/target/release/solomd-mcp.exe "app/src-tauri/binaries/solomd-mcp-${TARGET_TRIPLE}.exe"
          else
            cp mcp-server/target/release/solomd-mcp "app/src-tauri/binaries/solomd-mcp-${TARGET_TRIPLE}"
          fi

      - name: Pre-build MCP Sidecar (Cross macOS Targets)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          cargo build --release --target aarch64-apple-darwin --manifest-path mcp-server/Cargo.toml
          cargo build --release --target x86_64-apple-darwin --manifest-path mcp-server/Cargo.toml
          mkdir -p app/src-tauri/binaries
          cp mcp-server/target/aarch64-apple-darwin/release/solomd-mcp app/src-tauri/binaries/solomd-mcp-aarch64-apple-darwin
          cp mcp-server/target/x86_64-apple-darwin/release/solomd-mcp app/src-tauri/binaries/solomd-mcp-x86_64-apple-darwin

      - name: Compile Desktop App (Tauri Action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        with:
          projectPath: app
          args: ${{ matrix.args }}

      - name: Package Linux Standalone Tarball
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: |
          ARCH=$([ "${{ matrix.platform }}" = "ubuntu-24.04-arm" ] && echo "arm64" || echo "x64")
          MCP_BIN=$(find mcp-server/target -type f -name "solomd-mcp" | grep -E "(release/solomd-mcp|/release/solomd-mcp)" | head -1)
          if [ -n "$MCP_BIN" ] && [ -f "$MCP_BIN" ]; then
            STAGE="solomd-mcp-linux-${ARCH}"
            mkdir -p "$STAGE"
            cp "$MCP_BIN" "$STAGE/solomd-mcp"
            chmod +x "$STAGE/solomd-mcp"
            tar -czvf "solomd-mcp-linux-${ARCH}.tar.gz" -C "$STAGE" solomd-mcp
          fi

      - name: Package Windows Portable Zip & MCP Standalone
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          $arch = if ("${{ matrix.platform }}" -eq "windows-11-arm") { "arm64" } else { "x64" }
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $exe = "app/src-tauri/target/release/SoloMD.exe"
          $mcpExe = Get-ChildItem -Path "mcp-server/target" -Recurse -Filter "solomd-mcp.exe" |
                    Where-Object { $_.FullName -match "\\release\\" } | Select-Object -First 1
          
          $stage = "SoloMD_${version}_${arch}-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe -Destination "$stage/SoloMD.exe"
          if ($mcpExe) { Copy-Item $mcpExe.FullName -Destination "$stage/solomd-mcp.exe" }
          $zip = "SoloMD_${version}_${arch}-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

          if ($mcpExe) {
            $mcpStage = "solomd-mcp-win-${arch}"
            New-Item -ItemType Directory -Force -Path $mcpStage | Out-Null
            Copy-Item $mcpExe.FullName -Destination "$mcpStage/solomd-mcp.exe"
            $mcpZip = "solomd-mcp-win-${arch}.zip"
            Compress-Archive -Path "$mcpStage/*" -DestinationPath $mcpZip -Force
          }

      - name: Stage Compiled Artifacts
        shell: bash
        run: |
          mkdir -p target/artifacts
          find app/src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" \) -exec cp {} target/artifacts/ \;
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} target/artifacts/ \;
          ls -la target/artifacts

      - name: Upload Platform Artifacts to Actions Storage
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.platform }}
          path: target/artifacts/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Phase 3: Single Atomic Release Publisher & Provenance Signer (Fan-In)
  # Aggregates all Phase 1 & Phase 2 artifacts into a single GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: "Release & Provenance"
    needs: [satellites, desktop]
    runs-on: ubuntu-24.04
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
      tag: ${{ steps.manifest.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Download All Artifacts from Actions Storage
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      # 1. SBOM Generation
      - name: Generate CycloneDX SBOM (JSON)
        run: |
          cargo cyclonedx --manifest-path app/src-tauri/Cargo.toml --format json --override-filename "solomd-app-bom.json"
          cargo cyclonedx --manifest-path mcp-server/Cargo.toml --format json --override-filename "solomd-mcp-bom.json"
          mv app/src-tauri/solomd-app-bom.json artifacts/ || true
          mv mcp-server/solomd-mcp-bom.json artifacts/ || true
          find . -name "*.cdx.json" -exec mv '{}' artifacts/ ';' || true

      # 2. SSOT Manifest Compiler (Integrates CHANGELOG.md)
      - id: manifest
        name: Compile Distribution Manifest
        env:
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ruby <<'EOF'
          require 'digest'
          require 'fileutils'
          require 'json'

          tag = ENV.fetch('TAG_NAME')
          version = tag.sub(/^v/, '')
          repo = ENV.fetch('GH_REPO')

          artifacts_map = []
          Dir.glob('artifacts/*').sort.each do |fpath|
            next if File.directory?(fpath)
            fname = File.basename(fpath)
            next if fname == 'dist-manifest.json'

            sha256 = Digest::SHA256.file(fpath).hexdigest
            artifacts_map << {
              "name" => fname,
              "path" => fname,
              "size" => File.size(fpath),
              "sha256" => sha256
            }
          end

          # 1. Extract changelog section for this version from CHANGELOG.md (cargo-dist pattern)
          changelog_section = ""
          if File.exist?('CHANGELOG.md')
            changelog_content = File.read('CHANGELOG.md')
            pattern = /^##\s+\[?#{Regexp.escape(version)}\]?(?:\s*-\s*|\s+)[^\n]*\n(.*?)(?=^##\s+\[?|\z)/m
            match = changelog_content.match(pattern)
            changelog_section = match[1].strip if match
          end

          # 2. Build canonical release body
          release_body = ""
          if !changelog_section.empty?
            release_body << "#{changelog_section}\n\n"
          else
            release_body << "## What's new / 更新内容\n\nhttps://solomd.app/whats-new · 中文\n\n"
          end

          release_body << <<~MARKDOWN
            ### Verification & Security
            - SLSA Level 3 Provenance: Cryptographically signed via GitHub OIDC & Sigstore.
            - Manifest: Complete machine-readable distribution metadata in `dist-manifest.json`.
            - SBOM: Software Bill of Materials in CycloneDX JSON format (`solomd-app-bom.json`, `solomd-mcp-bom.json`).

            ### Downloads
            - macOS: `.dmg` (Universal binary)
            - Windows: `.msi` installer or portable `.zip` (x64 / ARM64)
            - Linux: `.AppImage`, `.deb`, `.rpm` (x64 / ARM64)
            - Web Extension: Chrome / Firefox WebClipper `.zip`
            - Agent Skills: Pre-packaged Agent Recipes `.zip`
            - MCP Server: Standalone `solomd-mcp` archive
          MARKDOWN

          manifest = {
            "schema_version" => "1.0.0",
            "app_name" => "solomd",
            "app_version" => version,
            "tag" => tag,
            "repository" => repo,
            "announcement_title" => "SoloMD #{tag}",
            "announcement_body" => release_body.strip,
            "announcement_is_prerelease" => tag.include?('-'),
            "artifacts" => artifacts_map
          }

          File.write('artifacts/dist-manifest.json', JSON.pretty_generate(manifest))
          puts "[+] Created artifacts/dist-manifest.json"

          File.open(ENV['GITHUB_OUTPUT'], 'a') do |f|
            f.puts "manifest=#{manifest.to_json}"
            f.puts "tag=#{tag}"
          end
          EOF

      - name: Attest Build Provenance (SLSA L3 via Sigstore/Rekor)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/*"

      - name: Create Atomic GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=$(jq -r '.announcement_title' artifacts/dist-manifest.json)
          IS_PRE=$(jq -r '.announcement_is_prerelease' artifacts/dist-manifest.json)
          PRERELEASE_FLAG=$([ "$IS_PRE" = "true" ] && echo "--prerelease" || echo "")
          jq -r '.announcement_body' artifacts/dist-manifest.json > /tmp/release_notes.md

          gh release create "${{ steps.manifest.outputs.tag }}" \
            $PRERELEASE_FLAG \
            --title "$TITLE" \
            --notes-file /tmp/release_notes.md \
            artifacts/*

  # ---------------------------------------------------------------------------
  # Phase 4: Downstream Distribution Matrix (Post-Release Fan-Out)
  # ---------------------------------------------------------------------------
  distribution:
    name: ${{ matrix.name }}
    needs: [release]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Homebrew"
            target: "homebrew"
          - name: "Crates.io"
            target: "crates-io"

    environment: ${{ matrix.target == 'crates-io' && 'crates.io' || '' }}
    permissions:
      contents: write
      id-token: write

    steps:
      # =========================================================================
      # 1. Target: Homebrew Tap Cask Synchronization
      # =========================================================================
      - name: Checkout Homebrew Tap
        if: matrix.target == 'homebrew'
        uses: actions/checkout@v7
        with:
          repository: "${{ github.repository_owner }}/homebrew-${{ github.event.repository.name }}"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Render and Push Cask File
        if: matrix.target == 'homebrew'
        env:
          TAG: ${{ needs.release.outputs.tag }}
          MANIFEST: ${{ needs.release.outputs.manifest }}
          GH_REPO: ${{ github.repository }}
        run: |
          ruby <<'EOF'
          require 'json'
          require 'fileutils'

          tag = ENV.fetch('TAG')
          version = tag.sub(/^v/, '')
          manifest = JSON.parse(ENV.fetch('MANIFEST'))
          repo = ENV.fetch('GH_REPO')

          dmg = manifest['artifacts']&.find { |a| a['name']&.end_with?('.dmg') }
          unless dmg
            puts "[!] No DMG artifact found in manifest. Skipping Homebrew Cask generation."
            exit 0
          end

          cask_content = <<~RUBY
            cask "solomd" do
              version "#{version}"
              sha256 "#{dmg['sha256']}"

              url "https://github.com/#{repo}/releases/download/#{tag}/#{dmg['name']}"
              name "SoloMD"
              desc "Markdown editor and bridge to your LLM"
              homepage "https://solomd.app/"
              auto_updates true

              livecheck do
                url :url
                strategy :github_latest
              end

              depends_on macos: ">= :big_sur"

              app "SoloMD.app"

              zap trash: [
                "~/Library/Application Support/app.solomd",
                "~/Library/Caches/app.solomd",
                "~/Library/Preferences/app.solomd.plist",
                "~/Library/Saved Application State/app.solomd.savedState",
                "~/Library/WebKit/app.solomd",
              ]
            end
          RUBY

          FileUtils.mkdir_p('Casks')
          File.write('Casks/solomd.rb', cask_content)
          puts "[+] Successfully rendered Casks/solomd.rb"
          EOF

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "Casks/solomd.rb" ]; then
            git add Casks/solomd.rb
            if git diff --staged --quiet; then
              echo "[i] No changes detected in Casks/solomd.rb"
            else
              git commit -m "chore(release): update solomd cask to ${TAG#v}"
              git push
              echo "[+] Successfully pushed updated cask to homebrew-solomd!"
            fi
          fi

      # =========================================================================
      # 2. Target: Crates.io Trusted Publishing via OIDC RFC 8693
      # =========================================================================
      # 📚 OIDC TRUSTED PUBLISHING ARCHITECTURE
      # 1. Bootstrap: solomd-mcp-test initial version published with API token.
      # 2. Security: GitHub Environment `crates.io` with tag protection `v*`.
      # 3. Trust: crates.io Trusted Publisher configured for zx0r/solomd (release.yml).
      # 4. Supply Chain: "Require trusted publishing" enabled to reject API token attacks.
      # =========================================================================
      - name: Checkout Code for Crates.io
        if: matrix.target == 'crates-io'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain for Crates.io
        if: matrix.target == 'crates-io'
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        if: matrix.target == 'crates-io'
        uses: rust-lang/crates-io-auth-action@v1.0.4
        id: auth

      - name: Publish Package to Crates.io (Idempotent)
        if: matrix.target == 'crates-io'
        shell: bash
        run: |
          CRATE_NAME=$(cargo metadata --manifest-path mcp-server/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[0].name')
          CRATE_VER=$(cargo metadata --manifest-path mcp-server/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[0].version')
          
          echo "[+] Checking if ${CRATE_NAME}@${CRATE_VER} exists on crates.io..."
          PUBLISHED=$(curl -s "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VER}" | jq -r '.version.num // empty')
          
          if [ "$PUBLISHED" = "$CRATE_VER" ]; then
            echo "[i] Package ${CRATE_NAME}@${CRATE_VER} is already published on crates.io. Skipping publish step."
          else
            echo "[+] Publishing ${CRATE_NAME}@${CRATE_VER} to crates.io via OIDC..."
            cargo publish --manifest-path mcp-server/Cargo.toml
            echo "[✓] Successfully published ${CRATE_NAME}@${CRATE_VER}!"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
