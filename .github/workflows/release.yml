name: Release SoloMD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1A: WebExtension Bundling (Fail-Fast Gate)
  # ---------------------------------------------------------------------------
  build-web-clipper:
    name: "1. Satellites / WebExtension"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Compile and Bundle Extensions
        working-directory: web-clipper
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          mkdir -p artifacts
          cp dist/chrome.zip artifacts/solomd-clipper-chrome.zip
          cp dist/firefox.zip artifacts/solomd-clipper-firefox.zip
          cp dist/source.zip artifacts/solomd-clipper-source.zip

      - name: Upload WebExtension Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-web-clipper
          path: web-clipper/artifacts/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Phase 1B: Agent Skill Pack Packaging (Fail-Fast Gate)
  # ---------------------------------------------------------------------------
  build-skill-pack:
    name: "1. Satellites / Skill Pack"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Package SoloMD Skill Pack
        run: |
          bash scripts/build-skill-pack.sh
          mkdir -p artifacts
          cp dist/solomd-skills-*.zip artifacts/

      - name: Upload Skill Pack Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-skill-pack
          path: artifacts/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Phase 2: Multi-Platform Desktop Compilation Matrix (Fan-Out)
  # Executed ONLY after Phase 1 passes successfully
  # ---------------------------------------------------------------------------
  build-desktop:
    name: "2. Desktop / ${{ matrix.name }}"
    needs: [build-web-clipper, build-skill-pack]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS Universal"
            platform: macos-latest
            args: '--bundles dmg'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - name: "Windows x64"
            platform: windows-latest
            args: '--bundles msi'
            rust_targets: ''
          - name: "Windows ARM64"
            platform: windows-11-arm
            args: '--bundles msi'
            rust_targets: ''
          - name: "Linux x64"
            platform: ubuntu-24.04
            args: '--bundles appimage,deb,rpm'
            rust_targets: ''
          - name: "Linux ARM64"
            platform: ubuntu-24.04-arm
            args: '--bundles appimage,deb,rpm'
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            mcp-server -> target

      - name: Install Linux Build Dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        uses: ./.github/actions/setup-system-deps

      - name: Install Frontend Dependencies
        run: cd app && pnpm install --frozen-lockfile

      - name: Pre-compile solomd-mcp Sidecar
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          bash scripts/build-mcp-sidecar.sh "$TRIPLE"

      - name: Build Tauri Desktop Bundles
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          cd app
          pnpm tauri build ${{ matrix.args }}

      - name: Windows Defender Verification Gate
        if: matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          $plat = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1
          $mp = if ($plat) { Join-Path $plat.FullName 'MpCmdRun.exe' }
                else { Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe' }
          if (-Not (Test-Path $mp)) { exit 0 }
          
          try { & $mp -SignatureUpdate | Out-Null } catch { }
          $targets = @(Get-ChildItem "app/src-tauri/target/release/bundle/msi" -Filter *.msi -ErrorAction SilentlyContinue)
          $targets += Get-ChildItem "app/src-tauri/target/release/SoloMD.exe" -ErrorAction SilentlyContinue
          
          foreach ($t in $targets) {
            $out = (& $mp -Scan -ScanType 3 -File $t.FullName -DisableRemediation 2>&1 | Out-String)
            if ($out -notmatch 'found no threats') {
              Write-Error "Defender heuristic violation detected on $($t.Name)"
              exit 1
            }
          }

      - name: Package Linux Standalone MCP Tarball
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: |
          ARCH="${{ matrix.platform == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }}"
          ASSET="solomd-mcp-linux-${ARCH}.tar.gz"
          BIN="$(find mcp-server/target -type f -name solomd-mcp -path '*/release/*' | head -1)"
          STAGE="$(mktemp -d)"
          cp "$BIN" "$STAGE/solomd-mcp"
          chmod +x "$STAGE/solomd-mcp"
          tar -C "$STAGE" -czf "$ASSET" solomd-mcp

      - name: Package Windows Portable Executable & Standalone MCP Zip
        if: matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          $arch = if ("${{ matrix.platform }}" -eq "windows-11-arm") { "arm64" } else { "x64" }
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $exe = "app/src-tauri/target/release/SoloMD.exe"
          $mcpExe = Get-ChildItem -Path "mcp-server/target" -Recurse -Filter "solomd-mcp.exe" |
                    Where-Object { $_.FullName -match "\\release\\" } | Select-Object -First 1
          
          $stage = "SoloMD_${version}_${arch}-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe -Destination "$stage/SoloMD.exe"
          if ($mcpExe) { Copy-Item $mcpExe.FullName -Destination "$stage/solomd-mcp.exe" }
          $zip = "SoloMD_${version}_${arch}-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

          if ($mcpExe) {
            $mcpStage = "solomd-mcp-win-${arch}"
            New-Item -ItemType Directory -Force -Path $mcpStage | Out-Null
            Copy-Item $mcpExe.FullName -Destination "$mcpStage/solomd-mcp.exe"
            $mcpZip = "solomd-mcp-win-${arch}.zip"
            Compress-Archive -Path "$mcpStage/*" -DestinationPath $mcpZip -Force
          }

      - name: Stage Compiled Artifacts
        shell: bash
        run: |
          mkdir -p target/artifacts
          find app/src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" \) -exec cp {} target/artifacts/ \;
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} target/artifacts/ \;
          ls -la target/artifacts

      - name: Upload Platform Artifacts to Actions Storage
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.platform }}
          path: target/artifacts/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Phase 3: Single Atomic Release Publisher & Provenance Signer (Fan-In)
  # Aggregates all Phase 1 & Phase 2 artifacts into a single GitHub Release
  # ---------------------------------------------------------------------------
  host:
    name: "3. Release / Host"
    needs: [build-web-clipper, build-skill-pack, build-desktop]
    runs-on: ubuntu-24.04
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
      tag: ${{ steps.manifest.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Download All Artifacts from Actions Storage
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      # 1. SBOM Generation
      - name: Generate CycloneDX SBOM (JSON)
        run: |
          cargo cyclonedx --manifest-path app/src-tauri/Cargo.toml --format json --override-filename "solomd-app-bom.json"
          cargo cyclonedx --manifest-path mcp-server/Cargo.toml --format json --override-filename "solomd-mcp-bom.json"
          mv app/src-tauri/solomd-app-bom.json artifacts/ || true
          mv mcp-server/solomd-mcp-bom.json artifacts/ || true
          find . -name "*.cdx.json" -exec mv '{}' artifacts/ ';' || true

      # 2. SSOT Manifest Compiler
      - id: manifest
        name: Compile Distribution Manifest
        env:
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ruby <<'EOF'
          require 'digest'
          require 'fileutils'
          require 'json'

          tag = ENV.fetch('TAG_NAME')
          version = tag.sub(/^v/, '')
          repo = ENV.fetch('GH_REPO')

          artifacts_map = []
          Dir.glob('artifacts/*').sort.each do |fpath|
            next if File.directory?(fpath)
            fname = File.basename(fpath)
            next if fname == 'dist-manifest.json'

            sha256 = Digest::SHA256.file(fpath).hexdigest
            artifacts_map << {
              "name" => fname,
              "path" => fname,
              "size" => File.size(fpath),
              "sha256" => sha256
            }
          end

          release_body = <<~MARKDOWN
            ## SoloMD #{tag}

            ### Verification & Security
            - SLSA Level 3 Provenance: Cryptographically signed via GitHub OIDC & Sigstore.
            - Manifest: Complete machine-readable distribution metadata in `dist-manifest.json`.
            - SBOM: Software Bill of Materials in CycloneDX JSON format (`solomd-app-bom.json`, `solomd-mcp-bom.json`).

            ### Downloads
            - macOS: `.dmg` (Universal binary)
            - Windows: `.msi` installer or portable `.zip` (x64 / ARM64)
            - Linux: `.AppImage`, `.deb`, `.rpm` (x64 / ARM64)
            - Web Extension: Chrome / Firefox WebClipper `.zip`
            - Skill Pack: Pre-packaged Agent Recipes `.zip`
            - MCP Server: Standalone `solomd-mcp` archive
          MARKDOWN

          manifest = {
            "schema_version" => "1.0.0",
            "app_name" => "solomd",
            "app_version" => version,
            "tag" => tag,
            "repository" => repo,
            "announcement_title" => "SoloMD #{tag}",
            "announcement_body" => release_body,
            "announcement_is_prerelease" => tag.include?('-'),
            "artifacts" => artifacts_map
          }

          File.write('artifacts/dist-manifest.json', JSON.pretty_generate(manifest))
          puts "[+] Created artifacts/dist-manifest.json"

          File.open(ENV['GITHUB_OUTPUT'], 'a') do |f|
            f.puts "manifest=#{manifest.to_json}"
            f.puts "tag=#{tag}"
          end
          EOF

      - name: Attest Build Provenance (SLSA L3 via Sigstore/Rekor)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/*"

      - name: Create Atomic GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=$(jq -r '.announcement_title' artifacts/dist-manifest.json)
          IS_PRE=$(jq -r '.announcement_is_prerelease' artifacts/dist-manifest.json)
          PRERELEASE_FLAG=$([ "$IS_PRE" = "true" ] && echo "--prerelease" || echo "")
          jq -r '.announcement_body' artifacts/dist-manifest.json > /tmp/release_notes.md

          gh release create "${{ steps.manifest.outputs.tag }}" \
            $PRERELEASE_FLAG \
            --title "$TITLE" \
            --notes-file /tmp/release_notes.md \
            artifacts/*

  # ---------------------------------------------------------------------------
  # Phase 4A: Homebrew Tap & Distribution Synchronization (Post-Release)
  # Syncs the newly minted release formulas to Homebrew Tap repository
  # ---------------------------------------------------------------------------
  publish-homebrew:
    name: "4. Distribution / Homebrew"
    needs: [host]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Homebrew Tap
        uses: actions/checkout@v7
        with:
          repository: "${{ github.repository_owner }}/homebrew-${{ github.event.repository.name }}"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Render and Push Cask File
        env:
          TAG: ${{ needs.host.outputs.tag }}
          MANIFEST: ${{ needs.host.outputs.manifest }}
          GH_REPO: ${{ github.repository }}
        run: |
          ruby <<'EOF'
          require 'json'
          require 'fileutils'

          tag = ENV.fetch('TAG')
          version = tag.sub(/^v/, '')
          manifest = JSON.parse(ENV.fetch('MANIFEST'))
          repo = ENV.fetch('GH_REPO')

          dmg = manifest['artifacts']&.find { |a| a['name']&.end_with?('.dmg') }
          unless dmg
            puts "[!] No DMG artifact found in manifest. Skipping Homebrew Cask generation."
            exit 0
          end

          cask_content = <<~RUBY
            cask "solomd" do
              version "#{version}"
              sha256 "#{dmg['sha256']}"

              url "https://github.com/#{repo}/releases/download/#{tag}/#{dmg['name']}"
              name "SoloMD"
              desc "Markdown editor and bridge to your LLM"
              homepage "https://solomd.app/"
              auto_updates true

              livecheck do
                url :url
                strategy :github_latest
              end

              depends_on macos: ">= :big_sur"

              app "SoloMD.app"

              zap trash: [
                "~/Library/Application Support/app.solomd",
                "~/Library/Caches/app.solomd",
                "~/Library/Preferences/app.solomd.plist",
                "~/Library/Saved Application State/app.solomd.savedState",
                "~/Library/WebKit/app.solomd",
              ]
            end
          RUBY

          FileUtils.mkdir_p('Casks')
          File.write('Casks/solomd.rb', cask_content)
          puts "[+] Successfully rendered Casks/solomd.rb"
          EOF

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "Casks/solomd.rb" ]; then
            git add Casks/solomd.rb
            if git diff --staged --quiet; then
              echo "[i] No changes detected in Casks/solomd.rb"
            else
              git commit -m "chore(release): update solomd cask to ${TAG#v}"
              git push
              echo "[+] Successfully pushed updated cask to homebrew-solomd!"
            fi
          fi

  # ---------------------------------------------------------------------------
  # Phase 4B: Crates.io Trusted Publishing via OIDC RFC 8693 (Post-Release)
  # ---------------------------------------------------------------------------
  publish-crates-io:
    name: "4. Distribution / Crates.io"
    needs: [host]
    runs-on: ubuntu-24.04
    
    # =========================================================================
    # 📚 OIDC TRUSTED PUBLISHING MANUAL (Best Practice)
    # =========================================================================
    # To securely publish to crates.io without storing permanent API tokens,
    # follow these 4 phases. Once completed, uncomment Phase 4 in this file.
    #
    # --- PHASE 1: Bootstrap (Manual) -----------------------------------------
    # crates.io requires the very first version (v0.1.0) to be published manually.
    # 1. Generate a temporary API token at: https://crates.io/settings/tokens
    #    (Scopes: publish-new, publish-update).
    # 2. In your local terminal run: `cargo login <TOKEN>`
    # 3. Publish the first version: `cargo publish`
    # 4. REVOKE the token on crates.io. Your local machine is now clean.
    #
    # --- PHASE 2: GitHub Environment (Security) ------------------------------
    # 1. Go to your repo: Settings -> Environments -> "New environment".
    # 2. Name it EXACTLY: `crates.io`
    # 3. (Recommended): Check "Required reviewers" and select yourself.
    # 4. Under "Deployment branches and tags", select "Selected branches and tags".
    #    Add rule: `v*` (Allows deployment only from release tags).
    #
    # --- PHASE 3: crates.io Trusted Publisher --------------------------------
    # 1. Go to: https://crates.io/crates/solomd-mcp/settings/new-trusted-publisher
    # 2. Select "GitHub Actions".
    # 3. Repository: `${{ github.repository }}`
    # 4. Workflow name: `release.yml`
    # 5. Environment name: `crates.io` (Must match Phase 2).
    #
    # --- PHASE 4: Workflow Activation ----------------------------------------
    # UNCOMMENT the `environment` and `permissions` blocks below, and replace 
    # the dummy `echo` script with `cargo publish`.
    # =========================================================================
    
    environment: crates.io
    permissions:
       contents: read    # Required to checkout the code
       id-token: write   # Required to request JWT token from GitHub OIDC
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1.0.4
        id: auth

      - name: Publish Package
        shell: bash
        run: cargo publish --manifest-path mcp-server/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
