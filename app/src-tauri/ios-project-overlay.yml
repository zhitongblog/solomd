# Everything the iOS Xcode project needs that `tauri ios init` does not
# generate. Applied by scripts/lib/ios_project_overlay.py, which build-ios.sh
# runs before every build.
#
# This file exists because all of it used to live only in
# gen/apple/project.yml, which is generated and gitignored. One
# `tauri ios init` regenerates that file and drops the lot — file
# associations, Files-app support, the #139 fix — with nothing said. Edit here;
# never edit gen/apple/project.yml, it is overwritten.
#
# ${VAR} is read from the environment, which build-ios.sh has already loaded
# from .env.local.

merge:
  settingGroups:
    app:
      base:
        # Xcode-managed profiles fight with the Distribution certificate and
        # produce CODE_SIGN_STYLE conflicts, so signing is manual. Note that
        # DEVELOPMENT_TEAM is set here rather than assumed: a freshly
        # generated project.yml has no such key at all, which is why the sed
        # that used to anchor on it did nothing on a regenerated project.
        DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${IOS_SIGNING_PROFILE_NAME}

  targets:
    solomd_iOS:
      info:
        properties:
          # Expose Documents in the Files app under "On My iPhone › SoloMD".
          # Files only lists an app's folder when BOTH this and
          # LSSupportsOpeningDocumentsInPlace (below) are true — with only this
          # one the folder silently never appears, which is why reviewers
          # "couldn't find" it.
          UIFileSharingEnabled: true

          # iOS 27 SDK: apps linked against it are killed at launch unless
          # they adopt the scene lifecycle, and declaring this manifest is how
          # tao 0.37 (Tauri 2.12) knows to run on it. One scene only — SoloMD
          # has no multi-window support on iPad, and allowing more would let
          # iPadOS open an empty second window. Documents opened from Files
          # then arrive at the scene delegate; ios_folder::hook_scene_delegate
          # keeps their security scope (and handles the cold-launch case tao
          # does not).
          UIApplicationSceneManifest:
            UIApplicationSupportsMultipleScenes: false
            UISceneConfigurations: {}

          # Live-reload from the dev server on the Mac.
          NSLocalNetworkUsageDescription: >-
            SoloMD connects to the Tauri development server running on your Mac
            to live-reload the editor UI.
          NSBonjourServices:
            - _http._tcp
          NSAppTransportSecurity:
            NSAllowsLocalNetworking: true
            NSAllowsArbitraryLoads: true

          # ★ #139 / Files visibility. Opening documents in place is what
          # makes "On My iPhone › SoloMD" show up in the Files app. The cost is
          # that a document opened from Files (iCloud Drive, another app's
          # folder) now arrives as the ORIGINAL file behind a security scope,
          # not as a copy in our Inbox — and Rust's std::fs cannot touch it
          # until startAccessingSecurityScopedResource() is called on the very
          # NSURL iOS handed us. ios_folder::hook_open_url wraps the app
          # delegate's application:openURL:options: to do exactly that before
          # tao turns the URL into a string, so read_file (and saving back to
          # the original) work. Shared / AirDropped files still arrive as
          # copies in the Inbox.
          #
          # UISupportsDocumentBrowser stays false: SoloMD never uses a
          # UIDocumentBrowserViewController, and true would make iOS treat us
          # as a document-browser app.
          LSSupportsOpeningDocumentsInPlace: true
          UISupportsDocumentBrowser: false

          # Declare SoloMD as an editor for .md / .markdown / .mdown / .mkd /
          # .txt so the Files app offers it under "Open With".
          CFBundleDocumentTypes:
            - CFBundleTypeName: Markdown Document
              CFBundleTypeRole: Editor
              LSHandlerRank: Owner
              LSItemContentTypes:
                - public.markdown            # system UTI, iOS 17+
                - net.daringfireball.markdown
                - com.solomd.markdown        # our fallback, below
            - CFBundleTypeName: Plain Text
              CFBundleTypeRole: Editor
              LSHandlerRank: Alternate
              LSItemContentTypes:
                - public.plain-text

          # Our own UTI, as a fallback for the system public.markdown that
          # only exists from iOS 17. Conforms to public.plain-text so other
          # Markdown tools still recognise the files as text.
          UTExportedTypeDeclarations:
            - UTTypeIdentifier: com.solomd.markdown
              UTTypeDescription: Markdown Document
              UTTypeConformsTo:
                - public.plain-text
                - public.text
                - public.data
              UTTypeTagSpecification:
                public.filename-extension: [md, markdown, mdown, mkd]
                public.mime-type: [text/markdown, text/x-markdown]

      settings:
        base:
          # Xcode 15's script sandbox blocks the Rust build script.
          ENABLE_USER_SCRIPT_SANDBOXING: false
          CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: true
          # Device-only build; keep the simulator slice from being demanded.
          EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
          # libgit2 needs libz and libiconv on iOS and neither is linked
          # automatically. The whole setting is ours — a freshly generated
          # project.yml has no OTHER_LDFLAGS at all, which is why the sed that
          # used to anchor on this line quietly did nothing on a regenerated
          # project. $(inherited) is what keeps setting it outright safe.
          OTHER_LDFLAGS: $(inherited) -lswiftCompatibility56 -lswiftCompatibilityConcurrency -lz -liconv

prepend:
  # Xcode's build phase runs with a minimal PATH and cannot find pnpm or
  # cargo, so the Rust build phase fails with "command not found" long before
  # anything interesting happens. Prepended, so the command itself stays
  # whatever the generator wrote.
  targets.solomd_iOS.preBuildScripts.0.script: |
    export PATH="$HOME/.npm-global/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"

remove:
  # Externals arrives both as a source path and as a build-phase output plus a
  # framework dependency, which Xcode reports as "Multiple commands produce
  # libapp.a".
  - path: targets.solomd_iOS.sources
    match: {path: Externals}
